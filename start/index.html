<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Pest Guides | Gear &amp; Grit</title>
  <meta name="description" content="Free pest control guides from Eric Bussey, who spent 7 years doing pest control in apartments.">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0B1B2C; --mid-navy: #142236; --brass: #C9952C; --brass-light: #DFB04A;
      --cream: #F5EEDC; --border: rgba(201,149,44,0.2); --text-muted: rgba(245,238,220,0.7);
    }
    body { font-family: 'Inter', sans-serif; background: var(--navy); color: var(--cream); line-height: 1.5; }
    .wrap { max-width: 480px; min-height: 100vh; margin: 0 auto; padding: 28px 24px 32px; display: flex; flex-direction: column; gap: 24px; }
    .logo { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.18em; text-align: center; color: var(--cream); text-decoration: none; }
    .logo span { color: var(--brass); }
    .intro { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
    .intro img { width: 104px; height: 104px; border-radius: 50%; border: 3px solid var(--brass); object-fit: cover; }
    h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 2.2rem; line-height: 1.1; letter-spacing: 0.02em; text-transform: uppercase; }
    .intro p { font-size: 0.98rem; color: var(--text-muted); }
    .guide-main { display: flex; flex-direction: column; gap: 6px; background: var(--brass); color: var(--navy); text-decoration: none; border-radius: 6px; padding: 20px 22px; transition: background 0.2s; }
    .guide-main:hover { background: var(--brass-light); }
    .guide-main strong { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .guide-main span { font-size: 0.9rem; font-weight: 500; }
    .soon { display: flex; flex-direction: column; gap: 10px; }
    .soon div { display: flex; justify-content: space-between; align-items: center; border: 2px dashed rgba(245,238,220,0.25); border-radius: 6px; padding: 15px 20px; color: var(--text-muted); }
    .soon b { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 1.1rem; letter-spacing: 0.04em; }
    .soon small { font-size: 0.8rem; }
    .spacer { flex-grow: 1; }
    footer { border-top: 1px solid var(--border); padding-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    footer a { color: var(--brass); font-weight: 600; font-size: 0.92rem; text-decoration: none; }
    footer a:hover { color: var(--brass-light); }
    footer small { color: var(--text-muted); font-size: 0.78rem; }
  </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FF6KGWE20C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FF6KGWE20C');
</script>
</head>
<body>
<main class="wrap">
  <a href="/" class="logo">GEAR <span>&amp;</span> GRIT</a>

  <div class="intro">
    <img src="/eric-headshot.jpg" alt="Eric Bussey">
    <h1>Bugs in your house?</h1>
    <p>I did pest control for 7 years, mostly roaches in apartments. Grab the free guide for your problem.</p>
  </div>

  <a href="/roaches/" class="guide-main">
    <strong>Free Roach Guide →</strong>
    <span>What to do, what to skip, and what I'd actually use</span>
  </a>

  <div class="soon">
    <div><b>MICE GUIDE</b><small>Coming soon</small></div>
    <div><b>DRAIN FLY GUIDE</b><small>Coming soon</small></div>
  </div>

  <div class="spacer"></div>

  <footer>
    <a href="/">Brands: work with me →</a>
    <small>@gearandgrit</small>
  </footer>
</main>
</body>
</html>
